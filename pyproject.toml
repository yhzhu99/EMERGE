[project]
name = "emerge-ehr"
version = "0.1.0"
description = "Code for EMERGE: multimodal EHR predictive modeling with retrieval-augmented generation."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "EMERGE Authors" }
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "torch>=2.2",
    "tqdm>=4.66",
]

[project.optional-dependencies]
lm = [
    "sentence-transformers>=3.0",
    "transformers>=4.42",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
