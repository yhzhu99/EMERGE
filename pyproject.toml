[project]
name = "emerge-ehr"
version = "0.1.0"
description = "Engineering reproduction of EMERGE for multimodal EHR prediction with KG-RAG."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "EMERGE Reproduction" }
]
dependencies = [
    "h5py>=3.11",
    "lightning>=2.2,<3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "torch>=2.2",
    "torchmetrics>=1.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
lm = [
    "sentence-transformers>=3.0",
    "transformers>=4.42",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
emerge = "emerge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emerge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
